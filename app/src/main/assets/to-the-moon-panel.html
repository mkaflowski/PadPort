<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html{background:#101826}body{margin:0;padding:16px;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;background:#101826;color:#eee9dc;font:16px Georgia,serif;touch-action:manipulation}
main{width:100%;max-width:640px;flex:0 0 auto;margin:auto 0}
header{text-align:center;border-bottom:1px solid #607287;padding-bottom:12px}h1{font-size:25px;font-weight:normal;letter-spacing:3px;margin:8px 0}.moon{display:inline-block;width:35px;height:35px;border-radius:50%;background:#eee9dc;box-shadow:inset -10px 0 #101826}#message{color:#b8c6d5;text-align:center;padding:14px}nav{display:flex;justify-content:center;gap:6px;margin:14px 0}nav[hidden]{display:none}button{font:inherit;color:inherit;background:#1d2b3e;border:1px solid #607287;border-radius:4px;min-height:46px;padding:10px;cursor:pointer}nav button{flex:1}.selected{border-color:#eee9dc;background:#30445e}#entries{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}#entries button{flex:0 1 calc(50% - 3.5px);min-width:0;overflow-wrap:anywhere;text-align:left}#detail{background:#ece6d5;color:#192334;padding:16px;border-radius:3px;margin-top:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}h2{font-size:19px;margin:0 0 8px}#empty{color:#b8c6d5;text-align:center}small{float:right;color:#c6d2df}
</style><script src="ui-strings.js"></script></head>
<body><main><header><span class="moon" aria-hidden="true"></span><h1>TO THE MOON</h1></header><div id="message"></div><nav id="tabs" hidden></nav><div id="empty"></div><div id="entries"></div><article id="detail" hidden></article></main><script src="to-the-moon-panel.js"></script></body></html>
