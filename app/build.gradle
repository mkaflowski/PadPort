plugins { id 'com.android.application' }

android {
    namespace 'pl.padport.app'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.padport.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // Prebuilt mkxp-z (RGSS) libraries: tools/fetch_rgss_engine.py -> src/main/jniLibs.
    // SDL loads libmkxp-z.so by its path in nativeLibraryDir, so libraries are extracted.
    packaging { jniLibs { useLegacyPackaging true } }
}

tasks.register('checkRgssEngine') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libmkxp-z.so').exists())
            throw new GradleException('RGSS engine missing: run python tools/fetch_rgss_engine.py')
    }
}
preBuild.dependsOn 'checkRgssEngine'

dependencies {
    // Experimental 64-bit renderer for MV/MZ where the system WebView is 32-bit (e.g. AYN Thor).
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:142.0.20250827004350'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
